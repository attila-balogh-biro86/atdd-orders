name: PR cleanup

on:
  pull_request:
    types: [closed]

permissions:
  id-token: write
  contents: read

jobs:
  delete-preview:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az containerapp delete -n "orders-pr-${{ github.event.pull_request.number }}" \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" --yes || echo "No preview app to delete"
